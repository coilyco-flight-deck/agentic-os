name: "Upload a forgejo Release asset"
description: |
  POST a single file as an asset on an existing forgejo Release. Idempotent:
  if an asset with the same name is already attached, it is deleted first
  and replaced. Sibling to `create-release` for the forgejo-canonical
  pipeline.

inputs:
  forgejo_token:
    description: "Forgejo API token. Defaults to the auto-issued job token."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL."
    required: false
    default: "https://forgejo.coilysiren.me"
  repo:
    description: "owner/name on forgejo."
    required: false
    default: ${{ github.repository }}
  release_id:
    description: "Forgejo release id from the create-release action."
    required: true
  file:
    description: "Path to the file to upload."
    required: true
  name:
    description: "Asset name as it should appear on the release. Defaults to basename of file."
    required: false
    default: ""

outputs:
  asset_url:
    description: "Browser-download URL for the uploaded asset."
    value: ${{ steps.upload.outputs.asset_url }}

runs:
  using: "composite"
  steps:
    - id: upload
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        REPO: ${{ inputs.repo }}
        RELEASE_ID: ${{ inputs.release_id }}
        FILE: ${{ inputs.file }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail

        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq
          else
            echo "::error::no apt-get or apk to install jq" >&2
            exit 1
          fi
        fi

        if [ ! -f "$FILE" ]; then
          echo "::error::file not found: $FILE" >&2
          exit 1
        fi

        asset_name="${NAME:-$(basename "$FILE")}"
        assets_base="$FORGEJO_BASE_URL/api/v1/repos/$REPO/releases/$RELEASE_ID/assets"

        # Idempotent replace: if an asset with this name already exists, delete it.
        existing_id=$(curl -sS \
          -H "Authorization: token $FORGEJO_TOKEN" \
          "$assets_base" \
          | jq -r --arg n "$asset_name" '.[] | select(.name==$n) | .id' \
          | head -n1)

        if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
          echo "asset '$asset_name' already attached (id=$existing_id), deleting"
          del_code=$(curl -sS -o /tmp/uploadasset-del.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$assets_base/$existing_id")
          if [ "$del_code" != "204" ]; then
            echo "::error::forgejo asset delete failed: HTTP $del_code"
            cat /tmp/uploadasset-del.json
            exit 1
          fi
        fi

        # POST the file as multipart/form-data with field name `attachment`
        # and ?name=<asset_name>. URL-encode the asset name.
        name_q=$(jq -rn --arg n "$asset_name" '$n|@uri')
        http_code=$(curl -sS -o /tmp/uploadasset.json -w '%{http_code}' \
          -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -F "attachment=@${FILE}" \
          "$assets_base?name=$name_q")

        if [ "$http_code" != "201" ]; then
          echo "::error::forgejo asset upload failed: HTTP $http_code"
          cat /tmp/uploadasset.json
          exit 1
        fi

        asset_url=$(jq -r '.browser_download_url' /tmp/uploadasset.json)
        echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
        echo "uploaded: $asset_url"
