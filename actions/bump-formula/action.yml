name: "Bump a Homebrew Formula via forgejo Contents API"
description: |
  Rewrite the `url "..."` line of a Homebrew Formula to point at the new
  tag + revision and PUT the result back via forgejo's Contents API. The
  canonical brew clone URL is forgejo, and the bump commit lands on the
  same forgejo repo that emitted the release - no cross-host writes.

inputs:
  forgejo_token:
    description: "Forgejo API token. Defaults to the auto-issued job token."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL."
    required: false
    default: "https://forgejo.coilysiren.me"
  repo:
    description: "owner/name on forgejo. The Formula lives in this repo."
    required: false
    default: ${{ github.repository }}
  formula_path:
    description: "Path to the Formula .rb file in the repo (e.g. Formula/ward.rb)."
    required: true
  tag:
    description: "Git tag the Formula should pin (e.g. v2.37.0)."
    required: true
  revision:
    description: "Commit SHA the tag points at."
    required: true
  url_template:
    description: |
      Template for the `url "..."` line that gets written. {REPO} is
      substituted with the `repo` input. Default produces the forgejo
      HTTPS clone URL.
    required: false
    default: 'https://forgejo.coilysiren.me/{REPO}.git'
  branch:
    description: "Branch the Formula bump lands on."
    required: false
    default: "main"
  message:
    description: "Commit message. {TAG} is substituted with the tag input."
    required: false
    default: "chore(formula): bump to {TAG} [skip ci]"

runs:
  using: "composite"
  steps:
    - id: bump
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        REPO: ${{ inputs.repo }}
        FORMULA_PATH: ${{ inputs.formula_path }}
        TAG: ${{ inputs.tag }}
        NEW_REVISION: ${{ inputs.revision }}
        URL_TEMPLATE: ${{ inputs.url_template }}
        BRANCH: ${{ inputs.branch }}
        MSG_TEMPLATE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        # Self-install jq if missing. Forgejo's default runner image
        # ships minimal; consumers shouldn't have to add a setup step.
        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq
          else
            echo "::error::no apt-get or apk to install jq" >&2
            exit 1
          fi
        fi

        # Resolve the templated URL + commit message.
        url_value="${URL_TEMPLATE//\{REPO\}/$REPO}"
        message="${MSG_TEMPLATE//\{TAG\}/$TAG}"

        # Fetch current Formula contents + sha (needed for PUT).
        meta=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
          "$FORGEJO_BASE_URL/api/v1/repos/$REPO/contents/$FORMULA_PATH?ref=$BRANCH")
        cur_sha=$(jq -r '.sha' <<< "$meta")
        # Forgejo returns base64 content; decode, rewrite, re-encode.
        tmp=$(mktemp -d)
        jq -r '.content' <<< "$meta" | base64 -d > "$tmp/formula.rb"

        new_line="  url \"${url_value}\", tag: \"${TAG}\", revision: \"${NEW_REVISION}\""
        # Replace the first `^  url "...` line. Use awk so we don't have to
        # escape the URL for sed (which may contain & or |).
        awk -v repl="$new_line" '
          BEGIN { done = 0 }
          /^  url "/ && !done { print repl; done = 1; next }
          { print }
        ' "$tmp/formula.rb" > "$tmp/formula.new.rb"
        mv "$tmp/formula.new.rb" "$tmp/formula.rb"

        new_b64=$(base64 -w0 < "$tmp/formula.rb")
        put_payload=$(jq -n --arg msg "$message" --arg c "$new_b64" \
          --arg sha "$cur_sha" --arg branch "$BRANCH" \
          '{message:$msg, content:$c, sha:$sha, branch:$branch}')

        http_code=$(curl -sS -o /tmp/putresp.json -w '%{http_code}' \
          -X PUT \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$put_payload" \
          "$FORGEJO_BASE_URL/api/v1/repos/$REPO/contents/$FORMULA_PATH")
        if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
          echo "::error::forgejo formula bump failed: HTTP $http_code"
          cat /tmp/putresp.json
          exit 1
        fi
