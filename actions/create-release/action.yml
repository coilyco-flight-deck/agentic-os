name: "Create a forgejo Release"
description: |
  POST a new Release to forgejo for the given tag. Replaces
  softprops/action-gh-release for the forgejo-canonical release pipeline.
  Idempotent: 409 (release already exists) is treated as success and the
  existing release id is returned so subsequent asset-upload steps can
  still attach files.

inputs:
  forgejo_token:
    description: "Forgejo API token. Defaults to the auto-issued job token."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL."
    required: false
    default: "https://forgejo.coilysiren.me"
  repo:
    description: "owner/name on forgejo."
    required: false
    default: ${{ github.repository }}
  tag:
    description: "Tag the release is anchored to. Must already exist."
    required: true
  name:
    description: "Release name. Defaults to the tag."
    required: false
    default: ""
  body:
    description: "Markdown release notes."
    required: false
    default: ""

outputs:
  release_id:
    description: "Forgejo release id, usable for asset upload."
    value: ${{ steps.create.outputs.release_id }}

runs:
  using: "composite"
  steps:
    - id: create
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
        NAME: ${{ inputs.name }}
        BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../_lib/release.sh"

        rel_name="${NAME:-$TAG}"
        json_tool=$(release_json_tool)

        echo "creating Forgejo release for $TAG"
        payload=$(release_json_make_create_payload "$json_tool" "$TAG" "$rel_name" "$BODY")

        if ! http_code=$(release_curl_status /tmp/relresp.json \
          -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "$FORGEJO_BASE_URL/api/v1/repos/$REPO/releases"); then
          echo "::error::forgejo release create request timed out or failed"
          cat /tmp/relresp.json
          exit 1
        fi

        case "$http_code" in
          201)
            release_id=$(release_json_get_field "$json_tool" /tmp/relresp.json id)
            ;;
          409)
            echo "release already exists for $TAG, looking it up"
            if ! http_code=$(release_curl_status /tmp/relresp.json \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_BASE_URL/api/v1/repos/$REPO/releases/tags/$TAG"); then
              echo "::error::forgejo release lookup timed out or failed"
              cat /tmp/relresp.json
              exit 1
            fi
            if [ "$http_code" != "200" ]; then
              echo "::error::forgejo release lookup failed: HTTP $http_code"
              cat /tmp/relresp.json
              exit 1
            fi
            release_id=$(release_json_get_field "$json_tool" /tmp/relresp.json id)
            ;;
          *)
            echo "::error::forgejo release create failed: HTTP $http_code"
            cat /tmp/relresp.json
            exit 1
            ;;
        esac

        echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
