name: "Semver tag bump"
description: |
  Bump the latest semver tag by a fixed amount (minor by default) and
  create the new tag on the forgejo repo via the Releases API, or run in
  compute-only mode so a workflow can verify an image before the public tag
  exists. Does NOT parse commit messages: every automated release is a minor
  bump, and major is hand-driven only (pass bump: major, e.g. from a
  workflow_dispatch). Nothing in commit history can escalate the bump.
  Replaces mathieudutour/github-tag-action for the forgejo-canonical release
  pipeline. Forgejo source of truth, no github API calls.

inputs:
  forgejo_token:
    description: "Forgejo API token. Defaults to the auto-issued job token."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL."
    required: false
    default: "https://forgejo.coilysiren.me"
  repo:
    description: "owner/name on forgejo."
    required: false
    default: ${{ github.repository }}
  bump:
    description: "Bump to apply (minor|major|patch|none). Default minor. Major is hand-driven only - commit history never escalates it."
    required: false
    default: "minor"
  create_tag:
    description: "Create the Forgejo tag when true. Set false to only compute the next release tag/version."
    required: false
    default: "true"
  tag_name:
    description: "Explicit tag to create. When set, semver lookup is skipped and this tag is used directly."
    required: false
    default: ""
  tag_prefix:
    description: "Tag prefix. Tags are <prefix><semver>."
    required: false
    default: "v"
  release_sha:
    description: "Commit SHA the new tag should point at."
    required: false
    default: ${{ github.sha }}

outputs:
  new_tag:
    description: "Computed tag, empty when no bump happened."
    value: ${{ steps.compute.outputs.new_tag }}
  new_version:
    description: "Computed semver, empty when no bump happened."
    value: ${{ steps.compute.outputs.new_version }}
  previous_tag:
    description: "Tag the bump is relative to."
    value: ${{ steps.compute.outputs.previous_tag }}
  changelog:
    description: "Markdown changelog of the commits included in the bump."
    value: ${{ steps.compute.outputs.changelog }}

runs:
  using: "composite"
  steps:
    - id: compute
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        REPO: ${{ inputs.repo }}
        BUMP: ${{ inputs.bump }}
        CREATE_TAG: ${{ inputs.create_tag }}
        TAG_NAME: ${{ inputs.tag_name }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: |
        set -euo pipefail

        git fetch --tags --quiet

        # Latest tag matching <prefix>MAJOR.MINOR.PATCH. Sort by version,
        # not lex, so v10.0.0 > v2.9.0.
        prev_tag=$(git tag --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
                    --sort=-v:refname | head -n1 || true)
        if [ -z "$prev_tag" ]; then
          prev_ver="0.0.0"
        else
          prev_ver="${prev_tag#"$TAG_PREFIX"}"
        fi

        # Commit range, for the changelog only. No message parsing: the
        # bump is whatever the caller passed (default minor). Major is
        # hand-driven, never inferred from a feat!: or BREAKING footer.
        if [ -n "$prev_tag" ]; then
          range="${prev_tag}..HEAD"
        else
          range="HEAD"
        fi

        create_tag="$CREATE_TAG"
        bump="$BUMP"
        tag_name="$TAG_NAME"
        case "$create_tag" in
          true|false) ;;
          *) echo "::error::create_tag must be true|false, got '$create_tag'"; exit 1 ;;
        esac
        case "$bump" in
          major|minor|patch|none) ;;
          *) echo "::error::bump must be major|minor|patch|none, got '$bump'"; exit 1 ;;
        esac

        if [ -n "$tag_name" ]; then
          new_tag="$tag_name"
          case "$new_tag" in
            "${TAG_PREFIX}"*)
              new_version="${new_tag#"$TAG_PREFIX"}"
              ;;
            *)
              echo "::error::explicit tag '$new_tag' must start with prefix '$TAG_PREFIX'"
              exit 1
              ;;
          esac
        else
          if [ "$bump" = "none" ]; then
            echo "no-bump signal; skipping tag creation"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$prev_tag" >> "$GITHUB_OUTPUT"
            {
              echo "changelog<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r maj min pat <<< "$prev_ver"
          case "$bump" in
            major) maj=$((maj+1)); min=0; pat=0 ;;
            minor) min=$((min+1)); pat=0 ;;
            patch) pat=$((pat+1)) ;;
          esac
          new_version="${maj}.${min}.${pat}"
          new_tag="${TAG_PREFIX}${new_version}"
        fi

        if [ -z "${new_version:-}" ]; then
          new_version="${new_tag#"$TAG_PREFIX"}"
        fi

        # Create the tag on forgejo. POST /api/v1/repos/{owner}/{name}/tags
        # accepts {tag_name, target}. Auto-issued token has write scope on
        # this repo. 201 Created on success.
        if [ "$create_tag" = "true" ]; then
          payload=$(printf '{"tag_name":"%s","target":"%s"}' "$new_tag" "$RELEASE_SHA")
          http_code=$(curl -sS -o /tmp/tagresp.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$FORGEJO_BASE_URL/api/v1/repos/$REPO/tags")
          case "$http_code" in
            201)
              ;;
            409)
              echo "tag already exists for $new_tag, continuing"
              ;;
            *)
              echo "::error::forgejo tag create failed: HTTP $http_code"
              cat /tmp/tagresp.json
              exit 1
              ;;
          esac
        else
          echo "dry-run tag computation only; not creating $new_tag"
        fi

        echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
        echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
        echo "previous_tag=$prev_tag" >> "$GITHUB_OUTPUT"
        {
          echo "changelog<<EOF"
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:'- %s (%h)' "$range"
          else
            git log --pretty=format:'- %s (%h)' HEAD
          fi
          echo ""
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
