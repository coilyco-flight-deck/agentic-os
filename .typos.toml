# extend-exclude binds only with --force-exclude, since pre-commit hands typos
# explicit paths. Keep it on this repo's own hook entry. agentic-os#1186.
[files]
extend-exclude = [
  "*.json",
  "*.lock",
]

[default.extend-words]
aos = "aos"
coilyco = "coilyco"
forgejo = "forgejo"
glitchtip = "glitchtip"
hashi = "hashi"
karabiner = "karabiner"
mcporter = "mcporter"
mis = "mis"
opencode = "opencode"
qwen = "qwen"
requets = "requets"
SOM = "SOM"
Iz = "Iz"
signoz = "signoz"
ward = "ward"
warp = "warp"
