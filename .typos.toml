# Path exclusion binds only because the generated hook passes --force-exclude:
# pre-commit hands typos explicit paths. See agentic-os#969 and #1152.
[files]
extend-exclude = [
  "*.json",
  "*.lock",
]

[default.extend-words]
aos = "aos"
coilyco = "coilyco"
forgejo = "forgejo"
glitchtip = "glitchtip"
hashi = "hashi"
karabiner = "karabiner"
mcporter = "mcporter"
mis = "mis"
opencode = "opencode"
qwen = "qwen"
requets = "requets"
SOM = "SOM"
Iz = "Iz"
signoz = "signoz"
ward = "ward"
warp = "warp"
