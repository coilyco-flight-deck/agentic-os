# Per-repo command allowlist. Add verbs here as they emerge.

commands:
  warp:
    run: go run -C warp .
    description: "Establish and verify Kai's Warp config across hosts. `ward exec warp apply` renders all three state layers (repo template, config-dir TOML, SQLite); `ward exec warp doctor` reports drift. See project-a-ward-exec-warp.md."
  render-issue-corpus:
    run: uv run python scripts/render-issue-corpus.py
    description: "Render the Forgejo issue corpus to a private git-mirrored discovery index - one markdown file per issue (`<owner>/<name>/<index>-<slug>.md`) under `--mirror-dir`, for offline grep. `ward exec render-issue-corpus -- --mirror-dir <clone>` renders every source repo in scripts/issue-corpus-repos.txt (open AND closed, body + every comment); `-- --repo <owner/name>` narrows, `-- --force` ignores the incremental fast path, `-- --no-scan` skips the trufflehog backstop (local dry runs only). Each file carries a disclaimer pointing back at the live `ward ops forgejo issue view <owner> <name> <N>` - a discovery index, not a source of truth. Incremental via manifest.json (skips issues whose updated_at is unchanged). All Forgejo I/O routes through `ward ops forgejo`, so it holds no FORGEJO_TOKEN. Git (clone/commit/push of the private mirror) lives in the hourly .forgejo/workflows/issue-corpus.yml cron, not the script. See docs/issue-corpus.md, agentic-os#297."
  agent-compat:
    run: uv run python scripts/agent-compat.py
    description: "Run daily unittest smoke checks for local agent harness compatibility. The roster is read live from `ward agents list --json` (ward#417), so it tracks ward's embedded fleet (Claude, Codex, OpenCode, Goose) instead of a private list; narrow with `-- --harness codex`. Uses unittest's native ok/FAIL/ERROR output and exit code. See docs/agent-compat.md."
  dev-base-build:
    run: docker build -t agentic-os:dev-base-local -f docker/dev-base/Dockerfile docker/dev-base
    description: "Build the dev-base image locally as agentic-os:dev-base-local for validating docker/dev-base/Dockerfile changes before the release workflow publishes the multi-arch image."
  dep-bump:
    run: uv run python scripts/dep-bump.py
    description: "Resolve the dev-base Dockerfile's pinned tool versions against upstream and bump them. `ward exec dep-bump -- check` reports drift (exit 1 if stale); `-- plan` emits the stale set as TSV (`--json` for machines); `-- apply --arg UV_VERSION --version X` rewrites one ARG. The scheduled .forgejo/workflows/dep-bump.yml runs this to auto-republish the image. See docs/dev-base-image.md."
  apply-agentic-os-hooks:
    run: uv run python scripts/apply-agentic-os-hooks.py
    description: "Roll out the canonical pre-commit hook block to every consumer repo under ~/projects/<org>/* (all org dirs). Idempotent."
  apply-agents-pointer:
    run: uv run python scripts/apply-agents-pointer.py
    description: "Inject or refresh the managed workspace-pointer block in each managed repo's AGENTS.md. Org-aware, idempotent. --dry-run to preview."
  apply-shell-links:
    run: uv run python scripts/apply-shell-links.py
    description: "Repoint this host's shell entry symlinks (~/.zshrc, ~/.bashrc, gpg-ssm) to the canonical agentic-os files. Idempotent; pass -- --check to fail on drift."
  gen-agents-pointer:
    run: uv run python -m agentic_os.generators.generate_agents_pointer
    description: "Render the managed AGENTS.md workspace-pointer block for an org (--org) or the cwd repo. Single source of truth for the block shape."
  audit-pre-commit-coverage:
    run: uv run python scripts/audit-pre-commit-coverage.py
    description: "Audit every repo under ~/projects/<org>/* for presence of the canonical agentic-os hook block."
  sweep-documentation-layout:
    run: uv run python scripts/sweep-documentation-layout.py
    description: "Read-only sweep: run the documentation-layout check across every workspace git repo and report passing/failing/disabled plus per-repo violation detail."
  sweep-precommit:
    run: uv run python scripts/sweep-precommit.py
    description: "Run the full pre-commit hook set (pre-commit run --all-files) across every workspace git repo and report per-repo Passed/Failed plus failing hook ids. Reverts autofix mutations so trees stay clean."
  pre-commit-all:
    run: pre-commit run --all-files
    description: "Run all pre-commit hooks against all files in the current repo."
  pre-commit-autoupdate:
    run: pre-commit autoupdate
    description: "Bump every third-party hook repo in .pre-commit-config.yaml to its latest tagged rev. Local hooks are unaffected (no rev)."
  pre-commit-code-comments:
    run: pre-commit run code-comments --all-files
    description: "Run only the code-comments hook across all files. Check comment-cap discipline at author time instead of waiting for the full commit gate."
  pre-commit-documentation-layout:
    run: pre-commit run documentation-layout --all-files
    description: "Run only the documentation-layout hook across all files. Check doc placement/size at author time instead of waiting for the full commit gate."
  pre-commit-ruff:
    run: pre-commit run ruff-check --all-files
    description: "Run only the ruff-check hook across all files. Check-only (no --fix)."
  pre-commit-shellcheck:
    run: pre-commit run shellcheck --all-files
    description: "Run only the shellcheck hook across all shell files. Check-only."
  release:
    run: uv run python scripts/release.py
    description: "Cut a release: bump pyproject + FALLBACK_REV floor, create signed tag, push (consumer pin is tag-derived). --bump major|minor|patch to override; --dry-run to preview."
  test:
    run: uv run pytest
    description: "Run the agentic_os Python test suite (pytest)."
  gen-repo-pointer-skill:
    run: uv run python -m agentic_os.generators.generate_repo_pointer_skill
    description: "Generate a repo-<name> pointer skill from GitHub metadata. Pipe `ward ops gh repo view coilysiren/<name>` into it with `<name> --from-json -`, or pass --description/--topic. See agentic-os-kai#312."
  gen-seed-skills:
    run: uv run python -m agentic_os.generators.generate_seed_skills
    description: "Regenerate agentic_os/seed_skills_data.py from the seed: frontmatter on the coding-<lang> skills. Run after editing a seed block; check-seed-skills-drift fails on staleness. See agentic-os#176."
  gen-caps-reference:
    run: uv run python -m agentic_os.generators.generate_caps_reference
    description: "Regenerate docs/catalog-caps-reference.md from the code-comments / documentation-layout validator constants. Run after changing a cap constant; check-caps-reference-drift fails on staleness. Docs and skills point at this render instead of restating a number. See agentic-os#284."
  agent-compose:
    run: uv run python -m agentic_os.generators.generate_agent_compose
    description: "Recompose the global agent-context files (~/.config/agent-compose/COMPOSED.<harness>.md) from the declared sources and re-point each harness load-point symlink. No-op without ~/.config/agent-compose/agent-compose.yaml. --dry-run prints the plan; --check fails on drift."
  ssm-path:
    run: uv run python -m agentic_os.pre_commit.check_ssm_path
    description: "Validate SSM parameter paths against the /<org>/<repo>/<tier>/<tail> schema. `ward exec ssm-path -- /coilysiren/backend/write/ts-authkey [more...]`, or `-- --stdin` for one path per line. A CLI validator (paths arrive as args, not repo files), so it is ward-fenced rather than a commit-path hook. See agentic-os#233."
  aws-config:
    run: uv run python -m agentic_os.pre_commit.check_aws_config
    description: "Lint ~/.aws/config (or $AWS_CONFIG_FILE) for the [profile default] trap the AWS SDK silently ignores, which surfaces later as a cryptic NoRegion from SSM/S3. No-op when the file is absent. A machine-env check, not repo content, so it is ward-fenced rather than a commit-path hook. Origin: agentic-os-kai#416, wired agentic-os#233."
  context-budget:
    run: uv run python -m agentic_os.pre_commit.check_context_budget
    description: "Report the eager startup-context budget each harness loads at session start vs a per-harness token budget, with per-source attribution. `-- --check` exits non-zero when any harness is over budget (for CI). On-demand by design, not a pre-commit hook. See docs/context-budget.md."
  gen-ward-ops-reference:
    run: bash scripts/gen-ward-ops-reference.sh
    description: "Regenerate docs/ward-ops-forgejo-reference.md from `ward ops forgejo describe` with a provenance header (as-of date + ward version). The committed render keeps operator-verb names greppable off-disk so a cold agent never guesses the name. Run at converge time or when ward-kdl's forgejo surface changes. See agentic-os#261."
  freshness:
    run: uv run python -m agentic_os.freshness
    description: "Knowledge-base freshness probe: parse `<!-- freshness: as-of= half-life= -->` provenance markers across tracked docs and grade each fact by age against its half-life horizon. `-- --check` exits non-zero when any fast-decay fact is past its horizon (the loud trigger a scheduled CI job fails on), `-- --lint` checks markers are well-formed. Hermetic, on-demand/scheduled, not a commit-path hook since rot is time-based. See docs/knowledge-base-freshness.md, agentic-os#262."
  agent-id:
    run: uv run python -m agentic_os.agent_id
    description: "Canonical short agent-id generator over the dictatable alphabet (lowercase 2-letter+2-digit, e.g. `ab85`). Bare invocation prints a fresh `secrets`-backed id (`-- -n 5` for more); `-- --seed <s>` prints the deterministic contract id for a seed, `-- --org <forgejo-org>` prints the short container token, `-- --emit-vectors` regenerates agent_id_vectors.json. The cross-repo naming primitive ward (#387) and cli-guard's Go port (#177) build against. See docs/dictatable-id-alphabet.md, agentic-os#302."

# Catalog metadata for the cross-repo knowledge graph.
# Schema: coilysiren/agentic-os-kai#420 (tracker).
catalog:
  kind: Component
  type: configuration
  system: ops
  owner: kai
  lifecycle: production
  description: "Personal agentic OS: shell config, terminal config, GPG/SSM tooling, Claude skills, and shared utility scripts symlinked into sibling coilysiren/* repos. Growing beyond just dotfiles into broader personal-OS scope."
  dependsOn: []
