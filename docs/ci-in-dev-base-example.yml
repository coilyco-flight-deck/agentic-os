# Reference CI workflow: run an app's gate INSIDE the pinned dev-base image,
# through the same `ward exec` verbs a dispatched agent runs, so a green CI
# means "a headless agent can land this." See docs/ci-in-dev-base.md.
#
# Copy this into an app's .forgejo/workflows/ci.yml. Replace the pinned tag with
# the value in aos docker/dev-base/ci-pinned-tag.txt (an ansible/template
# rollout does this for you). Pin an explicit vX.Y.Z, never :latest.
#
# This is a documentation reference copy owned by aos, not a live workflow -
# aos ships the convention, each app ships the rollout unit (agentic-os#328).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: docker
    # Pinned dev-base: the same image agents run in. Bump deliberately, never :latest.
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v6

      # The app's own gate verbs, defined in its .ward/ward.yaml - identical to
      # what a headless `ward agent` run executes. No hand-rolled uv/pip steps.
      - run: ward exec lint
      - run: ward exec test
      - run: ward exec smoke
