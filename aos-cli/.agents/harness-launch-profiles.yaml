format: agentic-os.harness-launch-profiles.v1
defaults:
  claude:
    model: claude-sonnet-4-6
    reasoning_effort: high
  codex:
    model: gpt-5.6-sol
    reasoning_effort: xhigh
    verbosity: low
  goose:
    model: ministral-3:14b
  opencode:
    model: qwen3.6:35b
    endpoint: http://host.docker.internal:8082/v1
default_agents:
  engineer: codex
  director: codex
  qa: codex
  ops: codex
  design: codex
  community: codex
  strats: codex
  content: codex
standalone_roles:
  director:
    claude:
      model: claude-fable-5
      reasoning_effort: xhigh
    codex:
      model: gpt-5.6-sol
      reasoning_effort: xhigh
  engineer:
    claude:
      model: claude-opus-4-8
      reasoning_effort: high
    codex:
      model: gpt-5.6-terra
      reasoning_effort: high
  ops:
    claude:
      model: claude-fable-5
      reasoning_effort: xhigh
    codex:
      model: gpt-5.6-sol
      reasoning_effort: xhigh
  qa:
    claude:
      model: claude-opus-4-8
      reasoning_effort: high
    codex:
      model: gpt-5.6-terra
      reasoning_effort: high
  strats:
    claude:
      model: claude-fable-5
      reasoning_effort: xhigh
    codex:
      model: gpt-5.6-sol
      reasoning_effort: xhigh
