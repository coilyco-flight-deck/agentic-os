---
# claude-dispatch-interactive - single-tab launch config fired by
# `coily dispatch interactive <ref>`.
#
# Coily <-> Warp seam (coilysiren/coily#270):
#   * coily owns the URL fire. It writes the minimal prompt
#     "Work on issue coilysiren/<repo>#<N>" to
#     /tmp/coily-dispatch-prompt.txt with mode 0600, then runs
#     `open warp://launch/claude-dispatch-interactive`.
#   * agentic-os owns this launch config. The script below reads the
#     scratch file, greps the ref out of it to derive the local repo
#     path, cwd's in, exec's claude with the prompt body, then deletes
#     the scratch file.
#   * No bidirectional coupling. coily has no idea what's in this file.
#     agentic-os has no idea coily exists. The two strings they agree on
#     are the scratch path and the launch name.
#
# Single tab on purpose: this is a focused human session, not a layout.
# If the operator wants a trio of tabs around it, they spawn those by
# hand or via claude-luca's pattern.
name: claude-dispatch-interactive
windows:
  - active_tab_index: 0
    tabs:
      - title: "dispatch · interactive"
        color: yellow
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;dispatch · interactive\007' && /Users/kai/projects/coilysiren/agentic-os/warp/launch_configurations/claude-dispatch-interactive.sh
