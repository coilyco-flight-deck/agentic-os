---
# claude-agent-work - single-tab launch config fired by
# `ward agent <mode> work <ref> --new-tab` (--surface window).
#
# Ward <-> Warp seam (ward#174, successor to the retired
# claude-dispatch-interactive):
#   * ward owns the URL fire. It validates the ref, writes a {ref,mode,title}
#     JSON entry to /tmp/ward-agent-queue (mode 0600), then runs
#     `open warp://launch/claude-agent-work`.
#   * agentic-os owns this launch config. The shim below pops the queue entry,
#     echoes the ref/title header, and execs `ward agent <mode> work <ref>`,
#     which clones the repo fresh inside an ephemeral container.
#   * The two strings the repos agree on are the queue path and the launch name.
#
# Single tab on purpose: this is a focused agent session, not a layout.
name: claude-agent-work
windows:
  - active_tab_index: 0
    tabs:
      - title: "agent · work"
        color: yellow
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;agent · work\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-agent-work.sh
