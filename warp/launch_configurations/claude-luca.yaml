---
# claude-luca - daily-driver window for the luca stack.
#
# Stack: repo-recall (cyan), session-lattice (magenta), luca (yellow).
# Layout: 2 scratch tabs (green) + 3 trios, one window.
# Each repo trio: claude tab + pulse/shell tab + edit tab (cwd into the repo,
# cats README.md so paths render clickable in Warp's editor).
#
# Conventions:
#   - All tabs cwd /Users/kai/projects/coilysiren; coily's ops verbs are
#     host-wide and don't bind to a repo, so no per-tab scope is set.
#   - Titles use ` · ` separator and pre-pin with printf to resist auto-rename.
#   - Each duo = working `claude` tab + pulse tab (watch loop or hint shell).
#   - Pulse tabs run against the local staging instance, never prod. Today only
#     repo-recall has a prod/staging split (repo-recall-staging at 127.0.0.1:7777);
#     session-lattice gets its own staging soon, swap its pulse over when it lands.
#   - Every tab shells out to a sibling claude-luca-<tab-slug>.sh script for its
#     body, even empty ones, so each `exec:` is a one-line printf + chain. Edit
#     scripts to change behavior, edit this file only for layout/structure.
#
# luca pulse stays a bare shell on purpose: on-demand dictation, not a watch loop.
# session-lattice pulse runs `watch git log` until the MCP lands.
#
# See ./README.md for the Warp launch-config schema and sharp edges.
name: claude-luca
windows:
  - active_tab_index: 0
    tabs:
      - title: "scratch · 1"
        color: green
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;scratch · 1\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-scratch-1.sh
      - title: "scratch · 2"
        color: green
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;scratch · 2\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-scratch-2.sh
      - title: "repo-recall · claude"
        color: cyan
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;repo-recall · claude\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-repo-recall-claude.sh
      - title: "repo-recall · pulse"
        color: cyan
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;repo-recall · pulse\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-repo-recall-pulse.sh
      - title: "repo-recall · edit"
        color: cyan
        layout:
          cwd: /Users/kai/projects/coilysiren/repo-recall
          commands:
            - exec: printf '\033]0;repo-recall · edit\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-repo-recall-edit.sh
      - title: "session-lattice · claude"
        color: magenta
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;session-lattice · claude\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-session-lattice-claude.sh
      - title: "session-lattice · pulse"
        color: magenta
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;session-lattice · pulse\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-session-lattice-pulse.sh
      - title: "session-lattice · edit"
        color: magenta
        layout:
          cwd: /Users/kai/projects/coilysiren/session-lattice
          commands:
            - exec: printf '\033]0;session-lattice · edit\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-session-lattice-edit.sh
      - title: "luca · claude"
        color: yellow
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;luca · claude\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-luca-claude.sh
      - title: "luca · shell"
        color: yellow
        layout:
          cwd: /Users/kai/projects/coilysiren
          commands:
            - exec: printf '\033]0;luca · shell\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-luca-shell.sh
      - title: "luca · edit"
        color: yellow
        layout:
          cwd: /Users/kai/projects/coilysiren/luca
          commands:
            - exec: printf '\033]0;luca · edit\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-luca-luca-edit.sh
