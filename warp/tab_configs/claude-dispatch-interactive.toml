# claude-dispatch-interactive - tab-scoped sibling of
# warp/launch_configurations/claude-dispatch-interactive.yaml. Fired by
# `coily dispatch interactive <ref>` via warp(preview)://tab_config/<name>
# so the dispatched claude lands in a new tab inside the active Warp
# window rather than a fresh window.
#
# Coily <-> Warp seam (coilysiren/coily#270 split, coilysiren/coily#274
# tab default): coily writes "Work on issue coilysiren/<repo>#<N>" to
# /tmp/coily-dispatch-prompt.txt mode 0600, fires the URI, and this
# config execs the shared shim under launch_configurations/ which reads
# the scratch file, derives the cwd, execs claude, and deletes the file.
#
# Re-uses the launch_configurations/claude-dispatch-interactive.sh shim
# verbatim - the shim has no schema dependency, just the scratch-file
# contract.
name = "claude-dispatch-interactive"

[[panes]]
id = "main"
type = "terminal"
directory = "/Users/kai/projects/coilysiren"
commands = [
  { exec = "printf '\\033]0;dispatch · interactive\\007' && /Users/kai/projects/coilysiren/agentic-os/warp/launch_configurations/claude-dispatch-interactive.sh" },
]

[params]
