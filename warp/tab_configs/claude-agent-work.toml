# claude-agent-work - tab-scoped sibling of
# warp/launch_configurations/claude-agent-work.yaml. Fired by
# `ward agent <mode> work <ref> --new-tab` via warp(preview)://tab_config/<name>
# so the agent session lands in a new tab inside the active Warp window rather
# than a fresh window. Successor to the retired claude-dispatch-interactive
# (ward#174).
#
# Ward <-> Warp seam: ward validates the ref, writes a {ref,mode,title} JSON
# entry to the /tmp/ward-agent-queue FIFO (mode 0600), fires the URI, and this
# config execs the shared shim under launch_configurations/ which pops the
# queue and execs `ward agent <mode> work <ref>`.
#
# Re-uses launch_configurations/claude-agent-work.sh verbatim - the shim has no
# schema dependency, just the queue-entry contract.
name = "claude-agent-work"

[[panes]]
id = "main"
type = "terminal"
directory = "/Users/kai/projects/coilysiren"
commands = [
  "printf '\\033]0;agent // work\\007' && /Users/kai/projects/coilyco-flight-deck/agentic-os/warp/launch_configurations/claude-agent-work.sh",
]

[params]
