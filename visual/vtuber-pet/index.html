<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hog girl - preview harness</title>
<style>
  :root { --pet: 360px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
    color: #cfc8de; background: #15131c;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 18px;
    padding: 8px 16px;
    background: #0d0a14; border-bottom: 1px solid #2a2438;
  }
  header b { color: #b8a4d8; letter-spacing: .3px; }
  header code { color: #45cdd0; }
  #status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #8a8296; }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  #status.live .dot { background: #45cdd0; box-shadow: 0 0 8px #45cdd0; }
  #status.err  .dot { background: #e06; box-shadow: 0 0 8px #e06; }
  #status .meta { color: #6f6880; font-variant-numeric: tabular-nums; }

  /* ---- main stage grid: the overlay must survive over each of these ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }
  .stage {
    position: relative;
    min-height: 340px;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    border-right: 1px solid rgba(255,255,255,.04);
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .stage .tag {
    position: absolute; top: 6px; left: 8px;
    font-size: 10px; letter-spacing: .5px; text-transform: uppercase;
    color: #fff; background: rgba(0,0,0,.45); padding: 2px 7px; border-radius: 3px;
    pointer-events: none;
  }
  /* representative surfaces a transparent OBS overlay lands on */
  .bg-dark  { background: #0e0e13; }                         /* dark editor */
  .bg-light { background: #e9e7f0; }                         /* bright wall / webcam */
  .bg-skin  { background: #c9a182; }                         /* skin tone (webcam face) */
  .bg-busy  {                                                /* high-clutter screen share */
    background:
      repeating-linear-gradient(45deg,#1b2540 0 22px,#243056 22px 44px),
      #1b2540;
  }
  .bg-photo {                                                /* mixed light+dark, hardest case */
    background: linear-gradient(115deg,#101018 0 35%, #d7cba6 35% 60%, #2a1622 60% 80%, #cfe2ea 80%);
  }

  .pet { width: var(--pet); height: var(--pet); display: block; }
  .pet svg { width: 100%; height: 100%; display: block; }

  /* ---- bottom rail: scale + silhouette reads ---- */
  .rail {
    display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end;
    padding: 20px 18px; background: #0d0a14; border-top: 1px solid #2a2438;
  }
  .cell { text-align: center; }
  .cell .cap { margin-top: 6px; font-size: 10px; color: #6f6880; letter-spacing: .4px; }
  .cell .box { background: #0e0e13; border-radius: 4px; padding: 6px; display: inline-block; }
  .cell.light .box { background: #e9e7f0; }
  .s32  .pet { width: 32px;  height: 32px; }
  .s64  .pet { width: 64px;  height: 64px; }
  .s128 .pet { width: 128px; height: 128px; }
  /* true silhouette: keep alpha, force every painted pixel to black */
  .silhouette .pet { filter: brightness(0); }
  .silhouette.onlight .box { background: #e9e7f0; }
</style>
</head>
<body>
<header>
  <b>Hog girl</b>
  <span>file <code id="path"></code></span>
  <span id="status"><span class="dot"></span><span class="word">connecting</span><span class="meta"></span></span>
</header>

<main class="grid">
  <div class="stage bg-dark"><span class="tag">dark editor</span><div class="pet" data-pet></div></div>
  <div class="stage bg-light"><span class="tag">bright</span><div class="pet" data-pet></div></div>
  <div class="stage bg-skin"><span class="tag">skin / webcam</span><div class="pet" data-pet></div></div>
  <div class="stage bg-busy"><span class="tag">busy screen</span><div class="pet" data-pet></div></div>
  <div class="stage bg-photo"><span class="tag">mixed light+dark</span><div class="pet" data-pet></div></div>
</main>

<section class="rail">
  <div class="cell s128"><span class="box"><span class="pet" data-pet></span></span><div class="cap">128 overlay</div></div>
  <div class="cell s64"><span class="box"><span class="pet" data-pet></span></span><div class="cap">64</div></div>
  <div class="cell s32"><span class="box"><span class="pet" data-pet></span></span><div class="cap">32 favicon</div></div>
  <div class="cell s64 silhouette"><span class="box"><span class="pet" data-pet></span></span><div class="cap">silhouette / dark</div></div>
  <div class="cell s64 silhouette onlight"><span class="box"><span class="pet" data-pet></span></span><div class="cap">silhouette / light</div></div>
</section>

<script>
  // ---- iteration harness -------------------------------------------------
  // Hot-swaps the pet SVG inline whenever the file changes on disk; full
  // page reload whenever this harness file itself changes. Poll-based so it
  // works against a plain static HTTP server with no build step or sockets.
  const PET  = new URLSearchParams(location.search).get("file") || "hog-girl-hero.svg";
  const SELF = location.pathname.split("/").pop() || "index.html";
  const POLL = 400;

  document.getElementById("path").textContent = PET;

  const statusEl = document.getElementById("status");
  const wordEl   = statusEl.querySelector(".word");
  const metaEl   = statusEl.querySelector(".meta");
  const targets  = () => document.querySelectorAll("[data-pet]");

  let petSig = null, selfSig = null, reloads = 0;

  const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; };

  async function fetchText(url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    return r.text();
  }

  function render(svg) {
    for (const el of targets()) el.innerHTML = svg;
    reloads++;
  }

  function setStatus(state, detail) {
    statusEl.className = state;                       // "live" | "err" | ""
    wordEl.textContent = state === "live" ? "live" : state === "err" ? "error" : "connecting";
    metaEl.textContent = detail || "";
  }

  async function tick() {
    try {
      const svg = await fetchText(PET);
      const sig = hash(svg);
      if (sig !== petSig) { petSig = sig; render(svg); }

      const self = await fetchText(SELF);
      const ssig = hash(self);
      if (selfSig === null) selfSig = ssig;
      else if (ssig !== selfSig) { location.reload(); return; }

      const now = new Date().toLocaleTimeString();
      setStatus("live", "swap #" + reloads + " - " + now);
    } catch (e) {
      setStatus("err", String(e.message || e));
    }
  }

  setInterval(tick, POLL);
  tick();
</script>
</body>
</html>
