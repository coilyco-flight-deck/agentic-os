<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Hog girl hero pose v2. Hand kit (ink/inkfine/grain filters + palette + disc frame)
       lifted verbatim from website/src/images/icon-trio/*.svg so she reads as a trio sibling.
       Aim: the style-triangle centroid - big GAU-8 centerpiece (weapon-forward A),
       legible A-10 rigging (mech C), moe face + twin tails (moe B).
       Layers: #ground (deck-plate = the icon disc), #chassis (lavender, static),
       #live-signal (teal, the only layer that animates later). -->
  <defs>
    <filter id="ink" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="61" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4"/>
    </filter>
    <filter id="inkfine" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="22"/>
      <feColorMatrix values="0 0 0 0 0.72  0 0 0 0 0.64  0 0 0 0 0.86  0 0 0 0.07 0"/>
    </filter>
    <clipPath id="disc"><circle cx="250" cy="250" r="183"/></clipPath>
  </defs>

  <!-- ============ GROUND: deck-plate = the icon disc (dark home + frame rings) ============ -->
  <g id="ground">
    <circle cx="250" cy="250" r="199" fill="#0d0a14"/>
    <g clip-path="url(#disc)" filter="url(#inkfine)" fill="none" stroke-linecap="round">
      <ellipse cx="250" cy="250" rx="150" ry="60" stroke="#b8a4d8" stroke-width="3.5" opacity="0.4" transform="rotate(-45 250 250)"/>
      <ellipse cx="250" cy="250" rx="150" ry="60" stroke="#45cdd0" stroke-width="3.5" opacity="0.4" transform="rotate(45 250 250)"/>
    </g>
    <circle cx="364" cy="335" r="5" fill="#45cdd0" filter="url(#inkfine)"/>
    <g filter="url(#ink)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="250" cy="250" r="208" stroke="#45cdd0" stroke-width="16"/>
      <circle cx="250" cy="250" r="191.5" stroke="#b8a4d8" stroke-width="17"/>
    </g>
  </g>

  <!-- ============ CHASSIS: lavender, static structure (line-art over the dark disc) ============ -->
  <g id="chassis" clip-path="url(#disc)">
    <g filter="url(#ink)" fill="none" stroke="#b8a4d8" stroke-linecap="round" stroke-linejoin="round">

      <!-- twin tails = A-10 twin vertical stabilizers, canted outward, fin tip on each -->
      <path d="M 198 196 C 178 156 168 132 150 104" stroke-width="13"/>
      <path d="M 302 196 C 322 156 332 132 350 104" stroke-width="13"/>
      <polygon points="133,118 158,92 171,110 147,134" fill="#b8a4d8" stroke="none"/>
      <polygon points="367,118 342,92 329,110 353,134" fill="#b8a4d8" stroke="none"/>

      <!-- engine nacelles (the A-10's high twin engines) = shoulder backpack tubes -->
      <path d="M 196 214 L 168 196" stroke-width="9"/>
      <path d="M 304 214 L 332 196" stroke-width="9"/>
      <circle cx="160" cy="206" r="26" stroke-width="10"/>
      <circle cx="340" cy="206" r="26" stroke-width="10"/>
      <line x1="138" y1="206" x2="128" y2="206" stroke-width="7"/>
      <line x1="362" y1="206" x2="372" y2="206" stroke-width="7"/>

      <!-- head -->
      <circle cx="250" cy="150" r="41" stroke-width="9"/>
      <!-- bangs -->
      <path d="M 224 124 L 234 140 M 250 118 L 250 136 M 276 124 L 266 140" stroke-width="7"/>
      <!-- moe twin-tail hair locks, short, tucked in front of the engine pods -->
      <path d="M 212 158 C 200 168 198 182 206 192" stroke-width="8"/>
      <path d="M 288 158 C 300 168 302 182 294 192" stroke-width="8"/>

      <!-- torso: flight suit, collar at the neck, fuller than chibi -->
      <path d="M 224 188 L 220 256 Q 250 272 280 256 L 276 188" stroke-width="9"/>
      <path d="M 228 192 L 250 204 L 272 192" stroke-width="6"/>

      <!-- hip skirt / wing-root, stubby winglets flanking the waist -->
      <path d="M 222 256 L 196 280" stroke-width="11"/>
      <path d="M 278 256 L 304 280" stroke-width="11"/>

      <!-- arms bracing the cannon: rear hand at the grip, lead hand forward on the housing -->
      <path d="M 278 214 Q 308 244 300 276" stroke-width="11"/>
      <path d="M 222 214 Q 214 252 240 284" stroke-width="11"/>
    </g>

    <!-- ===== the GAU-8 cannon: the centerpiece, a big diagonal across the lower body ===== -->
    <!-- local frame: muzzle cluster at origin, gun axis along +x toward the breech.
         placed muzzle-down-left (toward the cursor), breech up-right behind her arms. -->
    <g transform="translate(150 360) rotate(-28)">
      <g filter="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
        <!-- ammo drum at the breech -->
        <circle cx="212" cy="2" r="42" fill="none" stroke="#b8a4d8" stroke-width="10"/>
        <circle cx="212" cy="2" r="22" fill="none" stroke="#b8a4d8" stroke-width="6" opacity="0.7"/>
        <!-- gun housing: long capsule body -->
        <path d="M 60 -26 L 188 -26 Q 206 -26 206 0 Q 206 26 188 26 L 60 26 Q 44 26 44 0 Q 44 -26 60 -26 Z"
              fill="none" stroke="#b8a4d8" stroke-width="10"/>
        <!-- feed cover ridge on top of the housing -->
        <path d="M 78 -26 L 96 -42 L 168 -42 L 186 -26" fill="none" stroke="#b8a4d8" stroke-width="7"/>
        <!-- protruding rotary barrels (gatling cluster, side profile) -->
        <g stroke="#b8a4d8" stroke-width="8">
          <line x1="44" y1="-15" x2="-18" y2="-15"/>
          <line x1="44" y1="-5"  x2="-26" y2="-5"/>
          <line x1="44" y1="5"   x2="-26" y2="5"/>
          <line x1="44" y1="15"  x2="-18" y2="15"/>
        </g>
        <!-- muzzle ring shroud -->
        <circle cx="-22" cy="0" r="26" fill="none" stroke="#b8a4d8" stroke-width="9"/>
        <!-- rear grip the lead hand wraps -->
        <path d="M 96 26 L 104 50" fill="none" stroke="#b8a4d8" stroke-width="10"/>
      </g>
    </g>
  </g>

  <!-- ============ LIVE-SIGNAL: teal, the animate layer (muzzle, intakes, eyes, reticle) ============ -->
  <g id="live-signal" clip-path="url(#disc)" filter="url(#inkfine)" stroke-linecap="round" stroke-linejoin="round">
    <!-- engine intake glow rings -->
    <circle cx="160" cy="206" r="12" fill="none" stroke="#45cdd0" stroke-width="5"/>
    <circle cx="340" cy="206" r="12" fill="none" stroke="#45cdd0" stroke-width="5"/>
    <!-- determined-but-bright eyes: round with a confident upper lid -->
    <circle cx="234" cy="152" r="6" fill="#45cdd0"/>
    <circle cx="266" cy="152" r="6" fill="#45cdd0"/>
    <path d="M 226 146 Q 234 142 242 147" fill="none" stroke="#45cdd0" stroke-width="4"/>
    <path d="M 258 147 Q 266 142 274 146" fill="none" stroke="#45cdd0" stroke-width="4"/>
    <!-- warthog grin: confident upturned mouth with a couple of shark teeth (A-10 nose-art) -->
    <path d="M 236 170 Q 250 182 264 170" fill="none" stroke="#45cdd0" stroke-width="4"/>
    <path d="M 240 172 L 244 178 L 248 172 M 252 172 L 256 178 L 260 172" fill="none" stroke="#45cdd0" stroke-width="3" opacity="0.85"/>

    <!-- the gatling muzzle: teal barrel cluster + BRRRT glow, in the cannon's local frame -->
    <g transform="translate(150 360) rotate(-28)">
      <!-- barrel tips light up -->
      <g fill="#45cdd0">
        <circle cx="-18" cy="-15" r="4"/>
        <circle cx="-26" cy="-5" r="4"/>
        <circle cx="-26" cy="5" r="4"/>
        <circle cx="-18" cy="15" r="4"/>
      </g>
      <!-- muzzle core glow -->
      <circle cx="-22" cy="0" r="9" fill="#45cdd0"/>
      <!-- ammo-drum live tick -->
      <circle cx="212" cy="2" r="6" fill="none" stroke="#45cdd0" stroke-width="4" opacity="0.85"/>
    </g>

    <!-- targeting bracket off toward the cursor (shared reticle language) -->
    <g fill="none" stroke="#45cdd0" stroke-width="4" opacity="0.85">
      <path d="M 96 392 L 84 392 L 84 380"/>
      <path d="M 84 416 L 84 428 L 96 428"/>
    </g>
  </g>

  <!-- grain overlay, clipped to the disc so the overlay stays transparent outside -->
  <g clip-path="url(#disc)"><rect width="500" height="500" filter="url(#grain)" pointer-events="none"/></g>
</svg>
