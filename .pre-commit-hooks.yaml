# Cross-repo pre-commit hooks shipped by coilyco-flight-deck/agentic-os.
# Consumers reference via:
#
#   - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
#     rev: v0.1.0
#     hooks:
#       - id: catalog-doc-size
#       - id: catalog-trifecta
#       - id: documentation-layout
#       - id: context-load-points
#       - id: code-comments
#       - id: catalog-block-present
#       - id: check-skills
#       - id: dead-cross-links
#       - id: repo-pointer-skills
#       - id: agents-pointer
#       - id: misplaced-skills
#       - id: yaml-strict
#       - id: merge-conflicts
#       - id: seed-skills
#       - id: closes-issue
#       - id: trufflehog
#
# See coilysiren/agentic-os#59 for the trifecta convention.
# Rollout helper: agentic-os/scripts/apply-agentic-os-hooks.py.

- id: catalog-doc-size
  name: Markdown size caps
  description: Compatibility alias for documentation-layout Markdown size caps.
  entry: check-catalog-doc-size
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: catalog-trifecta
  name: catalog-trifecta cross-link convention
  description: Enforce that README + AGENTS + docs/FEATURES + .coily/coily.yaml cross-link. See coilysiren/agentic-os#59.
  entry: check-catalog-trifecta
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: documentation-layout
  name: documentation layout
  description: "Enforce Markdown placement and size: root allow-list, flat docs/, skill folders only, 80 lines / 4000 chars."
  entry: check-documentation-layout
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: context-load-points
  name: agent context load-points
  description: "Enforce the AGENTS/CLAUDE load-point framework: pure-pointer CLAUDE.md, no forked rungs in subdirs, root AGENTS.md needs a `@AGENTS.md` bridge. See coilysiren/agentic-os-kai#505."
  entry: check-context-load-points
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: code-comments
  name: code comment discipline
  description: Cap inline comments at two contiguous 90-char lines (a top-of-file header block is exempt); YAML allows comments only in that top block.
  entry: check-code-comments
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: catalog-block-present
  name: .coily/coily.yaml catalog block present
  description: Assert this repo declares its catalog metadata. See coilysiren/agentic-os-kai#420.
  entry: check-catalog-block
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: check-skills
  name: skill conventions
  description: Validate the structure of .agents/skills/ against .agents/skills/categories.yaml.
  entry: check-skills
  language: python
  additional_dependencies: [pyyaml]
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: dead-cross-links
  name: dead cross-links
  description: Validate that inline markdown links inside .agents/skills/ resolve to real files.
  entry: check-dead-links
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: repo-pointer-skills
  name: repo-pointer skills auto-generated
  description: Regenerate every repo-<name> pointer skill offline and fail on drift from generator output. See coilysiren/agentic-os-kai#312.
  entry: check-repo-pointer-skills
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agents-pointer
  name: AGENTS.md pointer block auto-generated
  description: Regenerate the managed workspace-pointer block in AGENTS.md offline and fail on drift. No-ops for unmanaged orgs and the canonical base repos. See coilyco-flight-deck/agentic-os#196.
  entry: check-agents-pointer
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: misplaced-skills
  name: no foreign repo-specific skills
  description: "Assert a repo does not host skills owned by another repo. Opt in via [tool.agentic-os.misplaced-skills] deny/allow globs; no-ops otherwise. See coilyco-flight-deck/agentic-os#132."
  entry: check-misplaced-skills
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: merge-conflicts
  name: no merge-conflict markers
  description: "Reject staged files still carrying merge-conflict markers (<<<<<<<, =======, >>>>>>>, |||||||). Catches a conflicted security-config script before it commits broken. See coilyco-flight-deck/agentic-os#39."
  entry: check-merge-conflicts
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: seed-skills
  name: code present implies seed-skill references
  description: "Assert a repo references the seed skills its code requires (always-set plus one per detected language) so qwen-opencode ingests the right context. Opt in via [tool.agentic-os.seed-skills]; no-ops otherwise. Ansible enables it fleet-wide. See coilyco-flight-deck/agentic-os#176."
  entry: check-seed-skills
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agent-compose-size
  name: agent-compose source size budget
  description: "Cap each AGENTS.COMPOSE.md and the repo's aggregate AGENTS.COMPOSE.md size. The composed file loads every session. See forgejo coilyco-flight-deck/agentic-os#138."
  entry: check-agent-compose-size
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agent-compose-dedup
  name: agent-compose dedup
  description: "Reject doctrine duplicated across AGENTS.COMPOSE.md sources or already present in the repo's AGENTS.md cascade. See forgejo coilyco-flight-deck/agentic-os#139."
  entry: check-agent-compose-dedup
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agent-compose-drift
  name: agent-compose composed-file drift
  description: "Verify ~/.config/agent-compose/COMPOSED.md is reproducible from the composer (not hand-edited or stale). Machine-state check; no-op without a config. See forgejo coilyco-flight-deck/agentic-os#140."
  entry: check-agent-compose-drift
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: yaml-strict
  name: strict canonical YAML
  description: "Autofix YAML to a deterministic canonical form: recursive mapping-key alpha-sort, recursive sequence sort by canonical serialization, comment stripping, single trailing newline, explicit --- start, 2-space indent. Rejects (without fixing) duplicate keys and anchors/aliases/tags. Re-stage after a fix. Dials + opt-outs under [tool.agentic-os.yaml-strict] (sort_sequences, no_comments, order_significant, excludes). See coilysiren/agentic-os#59."
  entry: check-yaml-strict
  language: python
  additional_dependencies: ["ruamel.yaml>=0.18"]
  types: [yaml]
  stages: [pre-commit]

- id: closes-issue
  name: commit closes a Forgejo issue (URL form)
  description: "Require a same-repo Forgejo issue URL close (closes/fixes/resolves https://forgejo.coilysiren.me/<owner>/<repo>/issues/N). Reject bare #N / owner/repo#N, which GitHub auto-closes by accident. See agentic-os-kai#496."
  entry: check-commit-closes-issue
  language: python
  stages: [commit-msg]

- id: conventional-commit
  name: conventional-commits 1.0.0
  description: Enforce Conventional Commits 1.0.0 subject format.
  entry: check-conventional-commit
  language: python
  stages: [commit-msg]

- id: trufflehog
  name: trufflehog (secret scan, offline)
  description: Detect secrets in staged changes via local trufflehog binary (no API verification). Requires the trufflehog binary on PATH (shipped in the agentic-os Brewfile).
  entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
  language: system
  pass_filenames: false
  stages: [pre-commit, pre-push]
