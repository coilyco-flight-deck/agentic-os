repos:
  # This repo ships the catalog hooks. Dogfood them via a local reference
  # to the package in this checkout. Consumers reference us as
  # repo: https://github.com/coilysiren/agentic-os instead.
  - repo: local
    hooks:
      - id: catalog-block-present
        name: .coily/coily.yaml catalog block present
        entry: python -m agentic_os.check_catalog_block
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-skills
        name: skill conventions (validate-skills)
        entry: python -m agentic_os.validate_skills
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: '^\.agents/skills/'
        stages: [pre-commit]
      # Deferred to the agentic-os self-compliance cascade (mirrors
      # agentic-os-kai#464): documentation-layout, context-load-points,
      # catalog-doc-size, catalog-trifecta, code-comments, dead-cross-links,
      # repo-pointer-skills.
      # README + docs/FEATURES still need See-also sections too.
      - id: closes-issue
        name: commit references a Forgejo issue
        entry: python -m agentic_os.check_commit_closes_issue
        language: python
        stages: [commit-msg]
      # Guards the `coily exec warp` tool itself. Runs `go vet` (which
      # compiles the module) so broken Go never lands. It deliberately does
      # NOT run `warp doctor`: doctor inspects live host state, and the
      # SQLite layer drifts as normal steady-state behavior, so a live check
      # at commit time would block commits for reasons unrelated to the diff.
      - id: warp-go-vet
        name: vet the coily exec warp module
        entry: bash -c 'cd warp && go vet ./...'
        language: system
        files: ^warp/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
  # No managed upstream-ref block here. This repo is the source; the rollout
  # is expected to never run against agentic-os itself. The local block above
  # dogfoods the validators via the in-checkout package.
