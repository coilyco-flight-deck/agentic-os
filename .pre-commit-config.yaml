repos:
  # This repo ships the catalog hooks. Dogfood them via a local reference
  # to the package in this checkout. Consumers reference us as
  # repo: https://github.com/coilysiren/agentic-os instead.
  - repo: local
    hooks:
      - id: catalog-block-present
        name: .coily/coily.yaml catalog block present
        entry: python -m agentic_os.check_catalog_block
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-skills
        name: skill conventions (validate-skills)
        entry: python -m agentic_os.validate_skills
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: '^\.agents/skills/'
        stages: [pre-commit]
      # Self-compliance cascade now landed (agentic-os#81, #96, #22): the
      # repo dogfoods its own catalog suite via the in-checkout package.
      - id: documentation-layout
        name: documentation layout
        entry: python -m agentic_os.check_documentation_layout
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: catalog-trifecta
        name: catalog-trifecta cross-link convention
        entry: python -m agentic_os.check_catalog_trifecta
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: context-load-points
        name: agent context load-points
        entry: python -m agentic_os.check_context_load_points
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: code-comments
        name: code comment discipline
        entry: python -m agentic_os.check_code_comments
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dead-cross-links
        name: dead cross-links
        entry: python -m agentic_os.check_dead_links
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: repo-pointer-skills
        name: repo-pointer skills auto-generated
        entry: python -m agentic_os.check_repo_pointer_skills
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: misplaced-skills
        name: no foreign repo-specific skills
        entry: python -m agentic_os.check_misplaced_skills
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: merge-conflicts
        name: no merge-conflict markers
        entry: python -m agentic_os.check_merge_conflicts
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: agent-compose-size
        name: agent-compose source size budget
        entry: python -m agentic_os.check_agent_compose_size
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: agent-compose-dedup
        name: agent-compose dedup
        entry: python -m agentic_os.check_agent_compose_dedup
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: closes-issue
        name: commit references a Forgejo issue
        entry: python -m agentic_os.check_commit_closes_issue
        language: python
        stages: [commit-msg]
      - id: conventional-commit
        name: commit message is conventional
        entry: python -m agentic_os.check_conventional_commit
        language: python
        stages: [commit-msg]
      # Guards the `coily exec warp` tool itself. Runs `go vet` (which
      # compiles the module) so broken Go never lands. It deliberately does
      # NOT run `warp doctor`: doctor inspects live host state, and the
      # SQLite layer drifts as normal steady-state behavior, so a live check
      # at commit time would block commits for reasons unrelated to the diff.
      - id: warp-go-vet
        name: vet the coily exec warp module
        entry: bash -c 'cd warp && go vet ./...'
        language: system
        files: ^warp/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
      # gofmt complements go vet: vet catches semantic issues, gofmt the layout.
      # -w rewrites in place; pre-commit fails the run if it had to touch a file,
      # so a reformatted file blocks the commit until it is re-staged.
      - id: warp-gofmt
        name: gofmt the coily exec warp module
        entry: bash -c 'cd warp && gofmt -w .'
        language: system
        files: ^warp/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
  # No managed upstream-ref block here. This repo is the source; the rollout
  # is expected to never run against agentic-os itself. The local block above
  # dogfoods the validators via the in-checkout package.
  # Third-party linters for the shell + Python surfaces that have no
  # agentic-os validator. Pin via `pre-commit autoupdate` to refresh revs.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # pre-commit tags .zsh as shell, but shellcheck has no zsh support
        # (SC2148/SC2296 on every zsh expansion). The zsh tree is zsh-only.
        exclude: ^zsh/
        # Gate on error-level only. The bash scripts carry intentional
        # patterns (literal \e passed to a later printf, ASCII-only tr) that
        # trip info/warning checks but are correct by design.
        args: [--severity=error]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
