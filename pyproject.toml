[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-os"
version = "0.13.0"
description = "Cross-repo pre-commit hooks and operating utilities for coilysiren/* repos: catalog-trifecta, catalog-doc-size, documentation-layout, code-comments, catalog-block, skill-conventions, dead-cross-links, commit-closes-issue."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kai Siren" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]
keywords = ["coilysiren", "pre-commit", "skill-discipline", "catalog", "validator"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/coilysiren/agentic-os"
Issues = "https://github.com/coilysiren/agentic-os/issues"

[project.scripts]
validate-skills = "agentic_os.validate_skills:main"
check-dead-links = "agentic_os.check_dead_links:main"
check-commit-closes-issue = "agentic_os.check_commit_closes_issue:main"
check-conventional-commit = "agentic_os.check_conventional_commit:main"
check-catalog-block = "agentic_os.check_catalog_block:main"
check-catalog-doc-size = "agentic_os.check_catalog_doc_size:main"
check-catalog-trifecta = "agentic_os.check_catalog_trifecta:main"
check-code-comments = "agentic_os.check_code_comments:main"
check-documentation-layout = "agentic_os.check_documentation_layout:main"
check-context-load-points = "agentic_os.check_context_load_points:main"
check-aws-config = "agentic_os.check_aws_config:main"
check-ssm-path = "agentic_os.check_ssm_path:main"
check-repo-pointer-skills = "agentic_os.check_repo_pointer_skills:main"
check-misplaced-skills = "agentic_os.check_misplaced_skills:main"
generate-repo-pointer-skill = "agentic_os.generate_repo_pointer_skill:main"

# Self-compliance config for the hooks this repo ships. See agentic-os#81,
# #96, #22.
[tool.agentic-os.documentation-layout]
# AGENTS.md here is the canonical operating-doctrine base, so it opts into
# the larger cap, matching agentic-os-kai's overlay.
agents_md_max_lines = 160
agents_md_max_chars = 12000
# Subsystem dirs carry idiomatic co-located READMEs and config docs that the
# root/docs/skills location rule does not model. Excluded per the #22 escape
# hatch: warp (Go module), voice (Windows daemon), visual (stream surfaces),
# plus root CHANGELOG.
excludes = [
    "CHANGELOG.md",
    "visual/**",
    "voice/README.md",
    "warp/README.md",
    "warp/launch_configurations/**",
    "warp/tab_configs/**",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agentic_os*"]
