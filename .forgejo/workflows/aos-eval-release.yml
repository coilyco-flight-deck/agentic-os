# Release aos-eval only when the shared grading package changes. Same shape as
# aos-precommit-release: the promoted release branch is already repository
# gated, and the train advances independently of the hook package so a consumer
# pinning one is never dragged by the other. See docs/release.md.

name: aos-eval-release

on:
  push:
    branches: [release]
    paths:
      - "aos-eval/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit aos-eval tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: aos-eval-release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          tag_prefix: aos-eval-v
          create_tag: true
          release_sha: ${{ github.sha }}

      - uses: ./actions/create-release
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: aos-eval ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
