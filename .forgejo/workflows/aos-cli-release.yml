# Release the portable aos CLI on its own tag clock. The repository's v* train
# remains owned by hooks and dev-base images.

name: aos-cli-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit aos version tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: aos-cli-release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Validate the release commit
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aos-cli-release.sh" validate

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          tag_prefix: aos-v
          create_tag: true
          release_sha: ${{ github.sha }}

      - name: Build binaries and package metadata
        env:
          AOS_RELEASE_VERSION: ${{ steps.tag.outputs.new_tag }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aos-cli-release.sh" build

      - id: create
        uses: ./actions/create-release
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: aos ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Attach release artifacts
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aos-cli-release.sh" attach

      - name: Update the Homebrew tap
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aos-cli-release.sh" update-homebrew

      - name: Update the Scoop bucket
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aos-cli-release.sh" update-scoop
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              proxy_url = os.environ.get("FORGEJO_EGRESS_PROXY", "").strip()
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({"https": proxy_url})
                  if proxy_url
                  else urllib.request.ProxyHandler()
              )
              try:
                  with opener.open(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
