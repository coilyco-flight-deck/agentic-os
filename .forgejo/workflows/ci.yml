# Pull-request CI gate for director-merge repos. This is the live version of
# docs/ci-in-dev-base-example.yml, and branch protection can require the
# resulting `ci / gate` status context on PR-gated workflows. `release` is the
# promoted last-known-good branch (ward#1117 / aos#469) and never re-gates:
# promote.yml already ran the suite on the exact sha it fast-forwarded, so a
# flaky rerun cannot fail a vouched promotion (Kai's call, 2026-07-12).
#
# The ward-doctor job is the standalone guardfile-load gate: guardfiles are
# config, so their validity check is ward loading them, never repo tests
# re-encoding their content. It is the same doctor the core image build runs
# (the aos#452 fail-closed path), moved up to commit time so a broken bundle
# cannot reach main.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WARD_WORKFLOW_VERSION: v0.775.0-tmp

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ward-doctor:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Install validated ward for workflow bundle support
        run: |
          set -euo pipefail
          scripts/install-workflow-ward.sh "${WARD_WORKFLOW_VERSION}"
      - name: Load the .ward bundle with the updated ward
        run: |
          set -euo pipefail
          export WARD_CONFIG_REF="file://${PWD}/.ward"
          CLIGUARD_NO_SANDBOX=1 ward doctor

  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install validated ward for repo gate
        run: |
          set -euo pipefail
          scripts/install-workflow-ward.sh "${WARD_WORKFLOW_VERSION}"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Repo test gate
        run: |
          set -euo pipefail
          uv run pytest
          # Same surface release.yml's gate enforces: without this, a
          # pre-commit violation passes the PR and reddens main (run 1078).
          pre-commit run --all-files
      - name: Alert Telegram on main failure
        if: ${{ failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
