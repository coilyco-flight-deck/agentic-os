# Pull-request CI gate for director-merge repos. This is the live version of
# docs/ci-in-dev-base-example.yml, and branch protection can require the
# resulting `ci / gate` status context on PR-gated workflows. `release` is the
# promoted last-known-good branch (ward#1117 / aos#469) and never re-gates:
# promote.yml already ran the suite on the exact sha it fast-forwarded, so a
# flaky rerun cannot fail a vouched promotion (Kai's call, 2026-07-12).
#
# The ward-doctor job is the standalone guardfile-load gate: guardfiles are
# config, so their validity check is ward loading them, never repo tests
# re-encoding their content. It is the same doctor the core image build runs
# (the aos#452 fail-closed path), moved up to commit time so a broken bundle
# cannot reach main.
#
# Beyond the test gate, PRs also run the validations that used to live only
# on main (agentic-os#454, preventing the agentic-os#452 red-main class):
# gate dry-runs the release tag computation, and build-dev-base builds the
# whole dev-base tier family through the shared ./actions/dev-base-build
# composite in build-only mode. That exercises every Dockerfile, pinned ARG,
# and the in-image `ward doctor` gate pre-merge, while publish, tag, and the
# GitHub mirror stay main-only. Branch protection can require the
# `ci / build-dev-base` context alongside `ci / gate`.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ward-doctor:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Install ward from source with workflow bundle support
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --branch main https://forgejo.coilysiren.me/coilyco-flight-deck/ward.git "$tmpdir/ward"
          cd "$tmpdir/ward"
          go build -trimpath -o "$tmpdir/ward/ward" ./cmd/ward
          "$tmpdir/ward/ward" --version
          echo "WARD_BIN=$tmpdir/ward/ward" >> "$GITHUB_ENV"
      - name: Load the .ward bundle with the updated ward
        run: |
          set -euo pipefail
          export WARD_CONFIG_REF="file://${PWD}/.ward"
          CLIGUARD_NO_SANDBOX=1 "$WARD_BIN" doctor

  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repo test gate
        run: |
          set -euo pipefail
          uv run pytest
          # Same surface release.yml's gate enforces: without this, a
          # pre-commit violation passes the PR and reddens main (run 1078).
          pre-commit run --all-files

      - name: Validate release planning (compute-only tag bump)
        uses: ./actions/tag-bump
        with:
          create_tag: false
      - name: Alert Telegram on main failure
        if: ${{ failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  build-dev-base:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Build and verify the dev-base tier family (no publish)
        uses: ./actions/dev-base-build
        with:
          tag: pr-${{ github.run_id }}

      - name: Clean up this run's local tier images
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # Build-only runs now export cache only, but keep this cleanup to
          # clear any stray pr-* tags from older runs on the shared daemon.
          command -v docker >/dev/null 2>&1 || exit 0
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | { grep ":pr-${{ github.run_id }}$" || true; } \
            | xargs -r docker rmi >/dev/null || true
