# Pull-request CI gate for director-merge repos. This is the live version of
# docs/ci-in-dev-base-example.yml, and branch protection can require the
# resulting `ci / gate` status context on PR-gated workflows.
#
# Beyond the test gate, PRs also run the validations that used to live only
# on main (agentic-os#454, preventing the agentic-os#452 red-main class):
# gate dry-runs the release tag computation, and build-dev-base builds the
# whole dev-base tier family through the shared ./actions/dev-base-build
# composite - the same definition release.yml publishes with - in build-only
# mode: no push, no tag, no registry auth. That exercises every Dockerfile,
# pinned ARG, and the in-image `ward doctor` gate pre-merge, while publish,
# tag, and the GitHub mirror stay main-only. Branch protection can require
# the `ci / build-dev-base` context alongside `ci / gate`. The job is
# pull_request-only: on main the same build runs (and publishes) through
# release.yml, so re-building here would only duplicate it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repo test gate
        run: |
          set -euo pipefail
          uv run pytest

      - name: Validate release planning (compute-only tag bump)
        uses: ./actions/tag-bump
        with:
          create_tag: false

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  build-dev-base:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Build and verify the dev-base tier family (no publish)
        uses: ./actions/dev-base-build
        with:
          tag: pr-${{ github.run_id }}

      - name: Clean up this run's local tier images
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # The build-only images land on the shared daemon; drop this run's
          # tags so PR runs do not pile named images up. The underlying
          # layers stay behind as build cache for the next PR.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | { grep ":pr-${{ github.run_id }}$" || true; } \
            | xargs -r docker rmi >/dev/null || true
