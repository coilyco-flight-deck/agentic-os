# Forgejo-canonical release pipeline. agentic-os dogfoods the composite
# actions it ships (actions/tag-bump, actions/create-release) via local
# `./actions/*` refs, so the source repo never depends on its own GitHub
# mirror being current to release. No bump input means every push-to-main
# release is a minor bump; major is hand-driven via scripts/release.py. The
# bump-pin job advances DEFAULT_REV (the consumer pin) the way ward bumps its
# formula url. Full rationale + skip-ci notes in docs/release.md.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: ./actions/create-release
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  bump-pin:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.CI_RELEASE_TOKEN }}
      - name: Bump DEFAULT_REV and push
        env:
          TAG: ${{ needs.release.outputs.tag }}
          PIN_PATH: scripts/apply-agentic-os-hooks.py
          FORGEJO_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::notice::bump-pin CI_RELEASE_TOKEN length=${#FORGEJO_TOKEN}"
          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "CI_RELEASE_TOKEN not set; skipping pin bump." >&2
            exit 0
          fi
          sed -i -E "s|^DEFAULT_REV = \"v[0-9]+\.[0-9]+\.[0-9]+\"\$|DEFAULT_REV = \"${TAG}\"|" "$PIN_PATH"
          if git diff --quiet -- "$PIN_PATH"; then
            echo "DEFAULT_REV already at ${TAG}, nothing to push"
            exit 0
          fi
          git config user.name "coilysiren"
          git config user.email "coilysiren@noreply.forgejo.coilysiren.me"
          git commit -m "chore: bump DEFAULT_REV to ${TAG} [skip ci]" -- "$PIN_PATH"
          git push origin HEAD:main
