# Forgejo-canonical release pipeline. agentic-os dogfoods the composite
# actions it ships (actions/tag-bump, actions/create-release) via local
# `./actions/*` refs, so the source repo never depends on its own GitHub
# mirror being current to release. No bump input means every push-to-main
# release is a minor bump; major is hand-driven via scripts/release.py. The
# bump-pin job advances DEFAULT_REV (the consumer pin) the way ward bumps its
# formula url. Full rationale + skip-ci notes in docs/release.md.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: ./actions/create-release
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  bump-pin:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      REPO: coilyco-flight-deck/agentic-os
      PIN_PATH: scripts/apply-agentic-os-hooks.py
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
    steps:
      - name: Rewrite DEFAULT_REV via forgejo Contents API
        run: |
          set -euo pipefail
          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "bump-pin: FORGEJO_TOKEN secret not set; skipping pin bump." >&2
            echo "DEFAULT_REV stays put until the secret is provisioned." >&2
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
          tmp=$(mktemp -d)
          meta=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_BASE_URL/api/v1/repos/$REPO/contents/$PIN_PATH?ref=main")
          cur_sha=$(jq -r '.sha' <<< "$meta")
          jq -r '.content' <<< "$meta" | base64 -d > "$tmp/pin.py"
          # Rewrite only the DEFAULT_REV assignment; leave the rest untouched.
          sed -E "s|^DEFAULT_REV = \"v[0-9]+\.[0-9]+\.[0-9]+\"\$|DEFAULT_REV = \"${TAG}\"|" \
            "$tmp/pin.py" > "$tmp/pin.new.py"
          if cmp -s "$tmp/pin.py" "$tmp/pin.new.py"; then
            echo "DEFAULT_REV already at ${TAG}, nothing to push"
            exit 0
          fi
          new_b64=$(base64 -w0 < "$tmp/pin.new.py")
          payload=$(jq -n --arg msg "chore: bump DEFAULT_REV to ${TAG} [skip ci]" \
            --arg c "$new_b64" --arg sha "$cur_sha" --arg branch main \
            '{message:$msg, content:$c, sha:$sha, branch:$branch}')
          code=$(curl -sS -o /tmp/pinresp.json -w '%{http_code}' -X PUT \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$FORGEJO_BASE_URL/api/v1/repos/$REPO/contents/$PIN_PATH")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::DEFAULT_REV bump failed: HTTP $code"
            cat /tmp/pinresp.json
            exit 1
          fi
