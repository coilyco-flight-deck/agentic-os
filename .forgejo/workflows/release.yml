# Forgejo-canonical release pipeline. agentic-os dogfoods the composite
# actions it ships (actions/tag-bump, actions/create-release) via local
# `./actions/*` refs, so the source repo never depends on its own GitHub
# mirror being current to release. This is the Forgejo-owned half of the
# default public-repo contract in docs/forgejo-github-mirror-contract.md.
# No bump input means every push-to-main release is a minor bump; major is
# hand-driven via scripts/release.py. The consumer pin resolves from the latest
# git tag at read time (agentic-os#238), so there is no pin-bump job and no
# per-push DEFAULT_REV commit - cutting the tag is the whole release. A
# workflow_dispatch trigger re-fires the same pipeline by hand when Forgejo
# misses a push enqueue (agentic-os#240), so a missed release needs no dummy
# commit to recover; its bump input still defaults to minor. The release
# pipeline now computes the next tag first, builds and verifies the dev-base
# image family by tier through the release helper, and only then creates the
# public git/release tag. That keeps the announced tag as the last success
# marker. Full rationale + skip-ci notes in docs/release.md, image notes in
# docs/dev-base-image.md. A front test job now gates planning, publish, tag,
# release, and ward-spec asset upload so release side effects cannot race
# ahead of the repo-authoritative checks.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for a manual run (minor|major|patch|none). Defaults to minor, matching push-to-main."
        required: false
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - patch
          - none

permissions:
  contents: write

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repo test gate
        run: |
          set -euo pipefail
          # The release image is expected to carry ward. If a future image
          # ever drops it, the fallback is the exact repo command the ward
          # verb wraps.
          if command -v ward >/dev/null 2>&1; then
            ward exec test
          else
            uv run pytest
          fi

          if command -v ward >/dev/null 2>&1; then
            ward exec pre-commit-all
          else
            pre-commit run --all-files
          fi

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  plan-release:
    needs: test
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          create_tag: false

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  publish-dev-base:
    needs: plan-release
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 120
    env:
      IMAGE_BASE: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
      UV_VERSION: 0.11.26
      BUILDX_VERSION: v0.34.1
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        run: |
          set -euo pipefail
          # The publish job still runs on the bare docker runner, so uv stays
          # job-local here even though the image family itself also ships it.
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv --version

      - name: Install docker CLI + buildx plugin
        run: |
          set -euo pipefail
          # Keep the buildx bootstrap here. dev-base does not yet carry a safe
          # Docker daemon/buildx stack for the publish jobs.
          docker_cli_ver=$(curl -fsSL https://download.docker.com/linux/static/stable/x86_64/ \
            | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -V | tail -1 \
            | sed -E 's/^docker-(.*)\.tgz$/\1/')
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_cli_ver}.tgz" \
            | tar -xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version
          docker --version

      - name: Resolve docker host
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] && continue
            [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then
              echo "docker daemon reachable at $h"
              echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
              echo "selected DOCKER_HOST=$h"
              docker -H "$h" version
              exit 0
            fi
            echo "no docker daemon at $h"
          done
          echo "no reachable docker daemon" >&2
          exit 1

      - name: Registry login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::error::REGISTRY_TOKEN not set; mint a forgejo PAT with write:package and add it as an Actions secret. See docs/dev-base-image.md." >&2
            exit 1
          fi
          echo "${REGISTRY_TOKEN}" | docker login forgejo.coilysiren.me -u coilyco-ops --password-stdin

      - name: Set up qemu + buildx builder
        run: |
          set -euo pipefail
          echo "buildx before bootstrap"
          docker buildx ls
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use --name aosbuilder \
            --driver docker-container --driver-opt network=host
          docker buildx inspect --bootstrap
          echo "buildx after bootstrap"
          docker buildx ls

      - name: Build and push (multi-arch)
        env:
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          set -euo pipefail
          timeout --preserve-status --kill-after=5m 120m \
            uv run python scripts/dev-base-build.py \
            --registry "${IMAGE_BASE}" \
            --tag "${TAG}" \
            build \
            --push \
            --platforms "${PLATFORMS}"

      - name: Verify pushed image manifests are pullable
        env:
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          set -euo pipefail
          for suffix in core lang-node lang-go lang-dotnet ops agent full; do
            ref="${IMAGE_BASE}-${suffix}:${TAG}"
            echo "verifying ${ref}"
            timeout --preserve-status --kill-after=15s 2m \
              docker buildx imagetools inspect "${ref}" >/dev/null
          done

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  release:
    needs: [plan-release, publish-dev-base]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          create_tag: true
          tag_name: ${{ needs.plan-release.outputs.tag }}

      - id: create
        uses: ./actions/create-release
        with:
          tag: ${{ needs.plan-release.outputs.tag }}
          name: ${{ needs.plan-release.outputs.tag }}
          body: ${{ needs.plan-release.outputs.changelog }}

      - name: Publish the ward-specs bundle as a pinned, checksummed release asset
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
          REL_ID: ${{ steps.create.outputs.release_id }}
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          set -euo pipefail
          # FORGEJO_TOKEN is the auto-issued job token that just created the
          # release (contents: write) - the same token create-release used, so
          # asset upload needs no extra secret. If this instance ever denies the
          # built-in token asset scope, this step fails loud and the fix is a PAT
          # secret, mirroring ward's publish-binaries CI_RELEASE_TOKEN.
          # ward's build input is homed here in .ward/ (flattened, aos#330 -
          # aos#315 first landed it at top-level ward-specs/); ward's build
          # sites pin + overlay THIS asset so ward's own tree can go neutral
          # without breaking the fleet's brew-from-source install. Pinning to a
          # dedicated tarball asset (not a raw tracked path) gives ward a stable,
          # checksummable URL. See docs/ward-specs.md and ward#503.
          if [ -z "${REL_ID:-}" ]; then
            echo "::error::no release_id from create-release; cannot attach ward-specs asset" >&2
            exit 1
          fi
          asset="ward-specs-${TAG}.tar.gz"
          # Deterministic tarball: sort entries, zero mtime/owner, no gzip name/time
          # header, so the checksum a downstream pins is reproducible from the tag.
          # The bundle now shares .ward/ with ward.yaml (aos#330), so enumerate the
          # bundle files EXPLICITLY rather than tarring the whole dir - a naive
          # `-C .ward . ` would sweep ward.yaml (and any future .ward/ file) into
          # ward's overlay input. Entries stay flat + `./`-prefixed, layout-identical
          # to the pre-move asset, so ward#503's overlay needs no change. List them
          # in alphabetical order: with explicit file args `--sort=name` is a no-op
          # (it only sorts recursive traversal), so the hand-order below IS the
          # tarball order, and it must match the sorted order the whole-dir tar used.
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C .ward -cf ward-specs.tar \
            ./forgejo-actions-list.sh \
            ./forgejo-actions-logs.sh \
            ./specverb.lock \
            ./agents.kdl \
            ./defaults.kdl \
            ./guardfile.aws.kdl \
            ./guardfile.forgejo.admin.kdl \
            ./guardfile.forgejo.kdl \
            ./guardfile.forgejo.read.kdl \
            ./guardfile.forgejo.readactions.kdl \
            ./guardfile.forgejo.write.kdl \
            ./guardfile.kubectl.kdl \
            ./repos.kdl \
            ./roles.kdl
          gzip -n -9 -c ward-specs.tar > "${asset}"
          sha256sum "${asset}" | awk '{print $1}' > "${asset}.sha256"
          echo "ward-specs asset sha256: $(cat "${asset}.sha256")"
          # Delete same-named assets first so a workflow_dispatch re-run for an
          # existing tag replaces rather than 400s on a duplicate (ward release.yml
          # convention).
          existing=$(curl -fsSL -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API}/releases/${REL_ID}/assets" || echo '[]')
          for name in "${asset}" "${asset}.sha256"; do
            old=$(printf '%s' "$existing" | ASSET="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const m = (a || []).find(x => x.name === process.env.ASSET);
              if (m) process.stdout.write(String(m.id));
            ')
            if [ -n "$old" ]; then
              curl -fsSL -X DELETE -H "Authorization: token ${FORGEJO_TOKEN}" \
                "${FORGEJO_API}/releases/${REL_ID}/assets/${old}" || true
            fi
            curl -fsSL -X POST -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${name}" \
              "${FORGEJO_API}/releases/${REL_ID}/assets?name=${name}"
            echo "uploaded ${name}"
          done
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
