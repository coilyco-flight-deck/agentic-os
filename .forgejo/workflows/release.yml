# Forgejo-canonical release pipeline. agentic-os dogfoods the composite
# actions it ships (actions/tag-bump, actions/create-release) via local
# `./actions/*` refs, so the source repo never depends on its own GitHub
# mirror being current to release. No bump input means every push-to-main
# release is a minor bump; major is hand-driven via scripts/release.py. The
# consumer pin resolves from the latest git tag at read time (agentic-os#238),
# so there is no pin-bump job and no per-push DEFAULT_REV commit - cutting the
# tag is the whole release. A workflow_dispatch trigger re-fires the same
# pipeline by hand when Forgejo misses a push enqueue (agentic-os#240), so a
# missed release needs no dummy commit to recover; its bump input still defaults
# to minor. The publish-image job builds + pushes the dev-base container
# (docker/dev-base/Dockerfile) to the forgejo registry under the same release
# tag, the analog of the brew bottle: build here, pull by tag in ward. Full
# rationale + skip-ci notes in docs/release.md, image notes in docs/dev-base-image.md.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for a manual run (minor|major|patch|none). Defaults to minor, matching push-to-main."
        required: false
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - patch
          - none

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: ./actions/create-release
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  publish-image:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      IMAGE: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
      BUILDX_VERSION: v0.34.1
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v6

      - name: Install docker CLI + buildx plugin
        run: |
          set -euo pipefail
          docker_cli_ver=$(curl -fsSL https://download.docker.com/linux/static/stable/x86_64/ \
            | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -V | tail -1 \
            | sed -E 's/^docker-(.*)\.tgz$/\1/')
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_cli_ver}.tgz" \
            | tar -xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version

      - name: Resolve docker host
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] && continue
            [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then
              echo "docker daemon reachable at $h"
              echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "no docker daemon at $h"
          done
          echo "no reachable docker daemon" >&2
          exit 1

      - name: Registry login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::error::REGISTRY_TOKEN not set; mint a forgejo PAT with write:package and add it as an Actions secret. See docs/dev-base-image.md." >&2
            exit 1
          fi
          echo "${REGISTRY_TOKEN}" | docker login forgejo.coilysiren.me -u coilysiren --password-stdin

      - name: Set up qemu + buildx builder
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use --name aosbuilder \
            --driver docker-container --driver-opt network=host
          docker buildx inspect --bootstrap

      - name: Build and push (multi-arch)
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${PLATFORMS}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
            --push \
            docker/dev-base
