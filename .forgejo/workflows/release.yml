# Forgejo-canonical release publication, manual retry only. promote.yml gates
# main and fast-forwards release. dev-base-publish.yml publishes the draft full
# image on that SHA. This workflow retags the draft, then creates the public
# git release as the last success marker.

name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to retag. Defaults to the dispatch ref."
        required: false
        default: ""
      tag:
        description: "Version tag override. Defaults to the next semver tag."
        required: false
        default: ""
      source-tag:
        description: "Draft tag override. Defaults to draft-<sha>."
        required: false
        default: ""
      bump:
        description: "Version bump for a manual run."
        required: false
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - patch
          - none

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan-release:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
      draft_tag: ${{ steps.draft.outputs.draft_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          create_tag: false
          tag_name: ${{ github.event.inputs.tag || '' }}
          release_sha: ${{ github.event.inputs.sha || github.sha }}

      - id: draft
        name: Derive the draft image tag
        env:
          SHA: ${{ github.event.inputs.sha || github.sha }}
          DRAFT_TAG_OVERRIDE: ${{ github.event.inputs['source-tag'] || '' }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/derive-draft-tag.sh"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              proxy_url = os.environ.get("FORGEJO_EGRESS_PROXY", "").strip()
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({"https": proxy_url})
                  if proxy_url
                  else urllib.request.ProxyHandler()
              )
              try:
                  with opener.open(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  retag-full:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base
        with:
          mode: promote
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: ${{ github.ref_name }}
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              proxy_url = os.environ.get("FORGEJO_EGRESS_PROXY", "").strip()
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({"https": proxy_url})
                  if proxy_url
                  else urllib.request.ProxyHandler()
              )
              try:
                  with opener.open(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  release:
    needs: [plan-release, retag-full]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          create_tag: true
          tag_name: ${{ needs.plan-release.outputs.tag }}

      - id: create
        uses: ./actions/create-release
        with:
          tag: ${{ needs.plan-release.outputs.tag }}
          name: ${{ needs.plan-release.outputs.tag }}
          body: ${{ needs.plan-release.outputs.changelog }}

      - name: Publish the ward-specs bundle as a pinned, checksummed release asset
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
          REL_ID: ${{ steps.create.outputs.release_id }}
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: bash scripts/ci/publish-ward-specs.sh

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              proxy_url = os.environ.get("FORGEJO_EGRESS_PROXY", "").strip()
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
