# Scheduled issue-corpus renderer. Renders the Forgejo issue corpus (every
# tracked source repo in scripts/issue-corpus-repos.txt, open AND closed, bodies
# plus every comment) to one markdown file per issue and pushes it to the private
# discovery-index mirror, so a warded container can grep the corpus offline to
# *locate* an issue, then confirm its live state via `ward ops forgejo issue
# view`. A discovery index, not an offline source of truth (agentic-os#297).
#
# The render+scan logic is scripts/render-issue-corpus.py; this job owns the git
# side (clone the private mirror, commit, push) the same way dep-bump.yml owns the
# bump push - keeping the renderer hermetic and unit-testable. The mount wiring
# that hydrates this mirror into containers is a separate ward issue, blocked on
# this. Runner provisioning (the `ward` binary, AWS/SSM for ward-kdl's coilyco-ops
# token, the private mirror repo, and the ISSUE_CORPUS_PUSH_TOKEN secret) is fleet
# rollout and lands in infrastructure/ansible per AGENTS.md, not here.
#
# Privacy: the mirror is private (it carries coilysiren/inbox). The renderer runs
# trufflehog over the corpus and exits non-zero on any finding BEFORE this job
# pushes, so a leaky corpus never lands. No-ops cleanly when the push token is
# unset (a runner without the secret), like mirror-to-github.yml, so it does not
# red-fail every hour until the rollout completes.
#
# MIRROR_REPO is the owner/name of the private discovery-index mirror on this
# Forgejo instance (FORGEJO_HOST); the job clones it with ISSUE_CORPUS_PUSH_TOKEN.
#
# Hourly at :23 (off the hour, and off dep-bump's :17 / freshness's :41, to dodge
# cron rush). Tight cadence bounds staleness; the renderer is incremental, so a
# run only re-renders issues whose updated_at changed. Walkthrough: docs/issue-corpus.md.

name: issue-corpus

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MIRROR_REPO: coilysiren/issue-corpus
  FORGEJO_HOST: forgejo.coilysiren.me

jobs:
  render:
    runs-on: docker
    steps:
      - uses: actions/checkout@v6

      - name: Render the issue corpus and push to the private mirror
        env:
          ISSUE_CORPUS_PUSH_TOKEN: ${{ secrets.ISSUE_CORPUS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ISSUE_CORPUS_PUSH_TOKEN}" ]; then
            echo "issue-corpus: ISSUE_CORPUS_PUSH_TOKEN not set; skipping." >&2
            exit 0
          fi

          # The Forgejo runner image is minimal; self-install python3 if absent.
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3 git
          fi

          # ward-kdl is the Forgejo I/O boundary (no FORGEJO_TOKEN in the script).
          # Provisioned on the runner by the infrastructure/ansible rollout.
          if ! command -v ward >/dev/null 2>&1; then
            echo "issue-corpus: ward not on PATH; runner not yet provisioned (rollout)." >&2
            exit 1
          fi

          MIRROR_DIR="$(mktemp -d)"
          CLONE_URL="https://x-access-token:${ISSUE_CORPUS_PUSH_TOKEN}@${FORGEJO_HOST}/${MIRROR_REPO}.git"
          git clone --depth 1 "${CLONE_URL}" "${MIRROR_DIR}"

          # Renders into MIRROR_DIR and runs trufflehog over the corpus; a finding
          # or a missing scanner exits non-zero here, before any commit or push.
          python3 scripts/render-issue-corpus.py --mirror-dir "${MIRROR_DIR}"

          cd "${MIRROR_DIR}"
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git add -A
          if git diff --cached --quiet; then
            echo "issue-corpus: corpus unchanged; nothing to push."
            exit 0
          fi
          git commit -m "chore(issue-corpus): refresh discovery index (agentic-os#297)"
          git push origin HEAD
