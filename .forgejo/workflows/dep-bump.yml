# Scheduled dev-base dependency auto-bump. Resolves each pinned tool in
# the dev-base Dockerfiles against upstream latest releases and, for every
# pin that drifted, commits one ARG bump and pushes to main. The push then rides
# the two-stage flow: promote.yml gates, republishes the full image, and
# fast-forwards `release`, while release.yml remains the manual retry hook for
# the same publication work, so the published dev-base stops lagging upstream
# with no human editing an ARG by hand
# (agentic-os#272, the ward#288/#301 staleness incident). The resolve+rewrite
# logic is scripts/dep-bump.py; this repo owns the publish pipeline per AGENTS.md
# and fleet rollout stays in infrastructure/ansible. One commit per tool keeps
# the bump auditable and bisectable.
#
# Runs daily at 09:17 UTC (off the hour, to dodge cron rush) and on dispatch.
# DEP_BUMP_TOKEN, when set, is a write:repository PAT so the bump push is
# attributed to a real user and reliably fast-forwards the release branch; the
# auto-issued job token still pushes without it, but some Forgejo versions
# suppress workflow runs from bot-token pushes. UPSTREAM_GH_TOKEN is optional
# and only lifts github.com's anonymous API rate limit. Full walkthrough:
# docs/dev-base-auto-bump.md.
# The applied bump tree now runs the repo test/pre-commit gate before the push
# so a bad pin leaves this workflow red and never reaches main.

name: dep-bump

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  WARD_WORKFLOW_VERSION: v0.775.0-tmp

jobs:
  bump:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.DEP_BUMP_TOKEN || github.token }}

      - name: Install validated ward for repo gate
        run: scripts/install-workflow-ward.sh "${WARD_WORKFLOW_VERSION}"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Resolve, commit, and push upstream bumps
        env:
          UPSTREAM_GH_TOKEN: ${{ secrets.UPSTREAM_GH_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/dep-bump.sh"
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              proxy_url = os.environ.get("FORGEJO_EGRESS_PROXY", "").strip()
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({"https": proxy_url})
                  if proxy_url
                  else urllib.request.ProxyHandler()
              )
              try:
                  with opener.open(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
