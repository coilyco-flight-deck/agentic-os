format: agentic-os.harness-launch-profiles.v1
defaults:
  claude: {model: claude-sonnet-4-6, reasoning_effort: high}
  codex: {model: gpt-5.6-sol, reasoning_effort: xhigh, verbosity: low}
  goose: {model: ministral-3:14b}
  opencode: {model: qwen3.6:35b, endpoint: "http://host.docker.internal:8082/v1"}
default_agents:
  codex: [engineer, director, qa, ops, design, community, strats, content]
standalone_role_profiles:
  - roles: [engineer, qa]
    harnesses:
      claude: {model: claude-opus-4-8, reasoning_effort: high}
      codex: {model: gpt-5.6-terra, reasoning_effort: high}
  - roles: [director, ops, strats]
    harnesses:
      claude: {model: claude-fable-5, reasoning_effort: xhigh}
