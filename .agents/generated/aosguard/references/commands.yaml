    - path:
        - aosguard
        - ops
        - forgejo
        - issue
        - comment
      summary: 'Post a comment on an issue, warning when the issue is closed (ward#380). Shadows the generated `issue comment` leaf (same 3-arg + --body signature): it GETs the issue to read its state, posts the comment, then `fail-when`s on state==''closed'' so commenting on a closed issue exits non-zero instead of passing silently. The comment IS still created - the non-zero exit and the issue body in the output are the warning that the target was closed, not a block on the post. Renders {comment, issue} together like every mount call action.'
      flags:
        - --body
        - --dry-run
        - --output
        - --query
    - path:
        - aosguard
        - ops
        - forgejo
        - issue
        - create
      summary: POST /repos/{owner}/{repo}/issues
      flags:
        - --assignee
        - --assignees
        - --body
        - --body-file
        - --closed
        - --dry-run
        - --due_date
        - --labels
        - --milestone
        - --output
        - --query
        - --ref
        - --title
